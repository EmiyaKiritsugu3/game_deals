name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gamedeals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/gamedeals_test' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'placeholder-publishable-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || 'placeholder-cron-secret' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun ci
      - name: Lint
        run: bunx biome check src/
      - name: Dependency audit
        run: bun audit --audit-level=high
      - name: Type check
        run: bunx tsc --noEmit
      - name: Unit Tests + Coverage
        run: bunx vitest run --coverage
      - name: SonarCloud Scan
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup env
        run: cp .env.example .env.local
      - name: Build
        run: bun --bun next build
      - name: Dead code
        run: bunx knip --no-exit-code
      - name: Fallow audit
        run: bunx fallow audit
        continue-on-error: true

  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: []
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gamedeals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gamedeals_test
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'placeholder-publishable-key' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || 'placeholder-cron-secret' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun ci
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Setup env
        run: cp .env.example .env.local
      - name: Stub Supabase bits (migrations reference auth schema/roles; vanilla PG lacks them)
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d gamedeals_test \
            -c "CREATE SCHEMA IF NOT EXISTS auth;
                CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY DEFAULT gen_random_uuid());
                DO \$fn\$ BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE proname = 'uid' AND n.nspname = 'auth') THEN
                    CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$body\$ SELECT NULL::uuid \$body\$;
                  END IF;
                END \$fn\$;
                DO \$\$ BEGIN
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role; END IF;
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated; END IF;
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon; END IF;
                END \$\$;"
      - name: Apply DB migrations (E2E needs full schema incl. views)
        run: bun run db:migrate
      - name: Seed E2E fixture games
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d gamedeals_test \
            -c "INSERT INTO games (\"cheapsharkId\", title) VALUES ('612', 'Outer Wilds'), ('999', 'E2E Fixture Game') ON CONFLICT DO NOTHING;"
      - name: Build
        run: bun --bun next build
      - name: E2E Tests
        run: bunx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
