name: Nightly E2E
on:
  schedule:
    - cron: '0 8 * * *' # 8:00 AM UTC
  workflow_dispatch:

jobs:
  e2e-all-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gamedeals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gamedeals_test
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'placeholder-publishable-key' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || 'placeholder-cron-secret' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun ci
      - name: Install all Playwright browsers
        run: bunx playwright install --with-deps
      - name: Stub Supabase bits
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d gamedeals_test \
            -c "CREATE SCHEMA IF NOT EXISTS auth;
                CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY DEFAULT gen_random_uuid());
                DO \$fn\$ BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE proname = 'uid' AND n.nspname = 'auth') THEN
                    CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$body\$ SELECT NULL::uuid \$body\$;
                  END IF;
                END \$fn\$;
                DO \$\$ BEGIN
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role; END IF;
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated; END IF;
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon; END IF;
                END \$\$;"
      - name: Setup env
        run: cp .env.example .env.local
      - name: Build
        run: bun run build
      - name: Run DB migrations
        run: bunx drizzle-kit migrate
      - name: Full E2E suite
        run: bunx playwright test --project=chromium --project=firefox --project=webkit
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-nightly
          path: playwright-report/
          retention-days: 14
