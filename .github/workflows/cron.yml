name: Cron Jobs
on:
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: ingest-prices
        run: |
          curl -sSf -X GET "$VERCEL_APP_URL/api/cron/ingest-prices" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "ingest-prices: HTTP %{http_code}\n"
        timeout-minutes: 4

      - name: reindex-typesense
        run: |
          curl -sSf -X GET "$VERCEL_APP_URL/api/cron/reindex-typesense" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "reindex-typesense: HTTP %{http_code}\n"
        timeout-minutes: 4

      - name: check-alerts
        run: |
          curl -sSf -X GET "$VERCEL_APP_URL/api/cron/check-alerts" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "check-alerts: HTTP %{http_code}\n"
        timeout-minutes: 4
